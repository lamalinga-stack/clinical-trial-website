<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfricaTrialUs Admin</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f7faf8; color: #183238; }
      .wrap { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
      .card { background: white; border: 1px solid #dbe8e4; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.04); }
      h1 { margin-top: 0; }
      form { display: grid; gap: 12px; max-width: 360px; }
      input { padding: 12px; border: 1px solid #cfe0dd; border-radius: 10px; }
      button { padding: 12px 16px; border: 0; border-radius: 10px; background: #087f78; color: white; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; margin-top: 20px; }
      th, td { padding: 10px 12px; border-bottom: 1px solid #e5eeeb; text-align: left; vertical-align: top; }
      .muted { color: #6c8183; }
      .hidden { display: none; }
      .error { color: #b33d2a; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="loginCard" class="card">
        <h1>Admin login</h1>
        <form id="loginForm">
          <input type="email" id="adminEmail" placeholder="Admin email" required />
          <input type="password" id="adminPassword" placeholder="Password" required />
          <button type="submit">Sign in</button>
        </form>
        <p id="loginError" class="error hidden"></p>
      </div>

      <div id="dashboard" class="card hidden">
        <h1>Participant submissions</h1>
        <p class="muted">View, review, and manage all entries submitted through the contact form.</p>
        <table>
          <thead>
            <tr>
              <th>Country</th>
              <th>Disease</th>
              <th>Email</th>
              <th>Address</th>
              <th>Code</th>
              <th>Telephone</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="submissionTableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
